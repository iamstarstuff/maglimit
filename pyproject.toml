[project]
name = "maglimit"
version = "0.1.0"
description = "Determine whether an astronomical object is observable with a given telescope"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Pratik Barve" },
    { name = "Namitha L S" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "astropy>=5.3",
    "astroquery>=0.4.7",
]
keywords = ["astronomy", "telescope", "limiting magnitude", "observing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]

[project.urls]
Homepage = "https://github.com/iamstarstuff/maglimit"
Documentation = "https://maglimit.readthedocs.io"
Issues = "https://github.com/iamstarstuff/maglimit/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
docs = [
    "sphinx>=7",
    "sphinx-rtd-theme>=2",
    "myst-nb>=1.1",
    "ipykernel>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["maglimit", "test", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["test"]
markers = ["network: tests that query the live NED service (deselect with -m 'not network')"]

[tool.ruff]
line-length = 100
